name: pro_peloton_manager
description: "Pro Peloton Manager - cycling team management game with a 3D race engine."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.3
  uuid: ^4.4.0
  intl: ^0.19.0
  fl_chart: ^0.68.0
  vector_math: ^2.1.4
  flutter_3d_controller: ^2.2.0
  flutter_inappwebview: ^6.1.5
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/images/
    - assets/3d/bikes/
    - assets/3d/cyclists/
    - assets/3d/riders/
    - assets/3d/roads/
    - assets/3d/furniture/
    - assets/3d/vehicles/
    - assets/3d/environment/

